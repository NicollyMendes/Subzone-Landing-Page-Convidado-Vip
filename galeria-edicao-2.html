<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subzone #002 — Galeria de Fotos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --vermelho-pressao: #F1120D;
      --preto-subsolo: #030405;
      --grafite-industrial: #121516;
      --concreto-frio: #2B3032;
      --vermelho-sangue-seco: #8A0B08;
      --vermelho-glow: #FF1A12;
      --cinza-metal-queimado: #5C6264;
      --off-white-sujo: #D7D2C8;
      --cinza-ruido: #8B8A84;
      --font-display: 'Bebas Neue', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Montserrat', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--preto-subsolo);
      color: var(--off-white-sujo);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ═══ HEADER ═══ */
    .gal-header {
      position: relative;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid rgba(241, 18, 13, 0.15);
      overflow: hidden;
    }
    .gal-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 100%, rgba(241, 18, 13, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--cinza-ruido);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--vermelho-glow); }
    .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    .gal-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 0.06em;
      color: var(--off-white-sujo);
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .gal-title span { color: var(--vermelho-pressao); }

    .gal-subtitle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--cinza-metal-queimado);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .gal-meta {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cinza-ruido);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .gal-meta .count { color: var(--vermelho-pressao); font-weight: 600; }

    /* ═══ GRID MASONRY ═══ */
    .photo-grid {
      column-count: 3;
      column-gap: 6px;
      padding: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) { .photo-grid { column-count: 2; } }
    @media (max-width: 520px) { .photo-grid { column-count: 2; column-gap: 4px; padding: 0.5rem; } }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 2px;
      background: var(--grafite-industrial);
    }
    @media (max-width: 520px) { .photo-item { margin-bottom: 4px; } }

    .photo-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.5s;
      filter: saturate(0.85);
    }
    .photo-item:hover img {
      transform: scale(1.04);
      filter: saturate(1) brightness(1.05);
    }

    .photo-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(3,4,5,0.4) 0%, transparent 40%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .photo-item:hover::after { opacity: 1; }

    .photo-item .photo-num {
      position: absolute;
      bottom: 8px;
      right: 8px;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: rgba(215, 210, 200, 0.5);
      letter-spacing: 0.1em;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .photo-item:hover .photo-num { opacity: 1; }

    /* ═══ DOWNLOAD (grid) ═══ */
    .photo-item .download-btn {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 32px;
      height: 32px;
      background: rgba(3,4,5,0.7);
      border: 1px solid rgba(241,18,13,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s, background 0.3s;
      z-index: 3;
      text-decoration: none;
    }
    .photo-item:hover .download-btn { opacity: 1; }
    .download-btn:hover { background: rgba(241,18,13,0.8); }
    .download-btn svg { width: 14px; height: 14px; stroke: var(--off-white-sujo); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ═══ EMPTY STATE ═══ */
    .empty-state {
      text-align: center;
      padding: 6rem 2rem;
    }
    .empty-state .icon {
      width: 48px; height: 48px;
      stroke: var(--cinza-metal-queimado);
      fill: none; stroke-width: 1.5;
      margin-bottom: 1.5rem;
    }
    .empty-state p {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--cinza-metal-queimado);
      letter-spacing: 0.05em;
    }

    /* ═══ LIGHTBOX ═══ */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(3, 4, 5, 0.96);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      cursor: default;
      border-radius: 2px;
      animation: lbFadeIn 0.25s ease;
    }
    @keyframes lbFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .lightbox-btn {
      position: absolute;
      background: none;
      border: none;
      cursor: pointer;
      padding: 12px;
      z-index: 10;
    }
    .lightbox-btn svg {
      width: 28px; height: 28px;
      stroke: var(--off-white-sujo); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(0,0,0,0.6));
      transition: stroke 0.2s;
    }
    .lightbox-btn:hover svg { stroke: var(--vermelho-glow); }

    .lb-close { top: 1rem; right: 1rem; }
    .lb-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 1rem; top: 50%; transform: translateY(-50%); }

    .lb-counter {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--cinza-ruido);
      letter-spacing: 0.15em;
    }

    /* ═══ DOWNLOAD (lightbox) ═══ */
    .lb-download {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 8px 16px;
      background: rgba(241,18,13,0.85);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: #fff;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.3s;
      z-index: 10;
    }
    .lb-download:hover { background: var(--vermelho-glow); }
    .lb-download svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 768px) {
      .lb-prev, .lb-next { display: none; }
    }

    /* ═══ FOOTER ═══ */
    .gal-footer {
      text-align: center;
      padding: 3rem 1.5rem;
      border-top: 1px solid rgba(241, 18, 13, 0.1);
    }
    .gal-footer a {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--cinza-ruido);
      text-decoration: none;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .gal-footer a:hover { color: var(--vermelho-glow); }

    .photo-item.loading {
      min-height: 200px;
      background: var(--grafite-industrial);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>

<script>
/* ══════════════════════════════════════════════════════════════
   ★★★  CONFIGURAÇÃO DA GALERIA — EDITE AQUI  ★★★
   
   Coloque os arquivos na pasta "fotos/edicao2/"
   e adicione o caminho no array abaixo.
   
   const FOTOS = [
     "fotos/edicao2/1.jpg",
     "fotos/edicao2/2.jpg",
     "fotos/edicao2/3.jpg",
   ];
   
   ══════════════════════════════════════════════════════════════ */

const FOTOS = [
  "fotos/edicao2/1.jpg",
  "fotos/edicao2/2.jpg",
  "fotos/edicao2/3.jpg",
  "fotos/edicao2/4.jpg",
  "fotos/edicao2/5.jpg",
  "fotos/edicao2/6.jpg",
  "fotos/edicao2/7.jpg",
  "fotos/edicao2/8.jpg",
  "fotos/edicao2/9.jpg",
  "fotos/edicao2/10.jpg",
  "fotos/edicao2/11.jpg",
  "fotos/edicao2/12.jpg",
  "fotos/edicao2/13.jpg",
  "fotos/edicao2/14.jpg",
  "fotos/edicao2/15.jpg",
  "fotos/edicao2/16.jpg",
  "fotos/edicao2/17.jpg",
  "fotos/edicao2/18.jpg",
  "fotos/edicao2/19.jpg",
  "fotos/edicao2/20.jpg"
  
];

const EDICAO = {
  numero: "#002",
  nome: "Segunda Edição",
  data: "2026",
  local: "Cuiabá — MT",
};
</script>

<!-- HEADER -->
<header class="gal-header">
  <a href="index.html#gallery" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Voltar ao site
  </a>
  <h1 class="gal-title">FOTOS <span id="edicaoNum"></span></h1>
  <p class="gal-subtitle" id="edicaoNome"></p>
  <div class="gal-meta">
    <span id="metaLocal"></span>
    <span>—</span>
    <span id="metaData"></span>
    <span>—</span>
    <span><span class="count" id="photoCount">0</span> fotos</span>
  </div>
</header>

<!-- GRID -->
<main class="photo-grid" id="photoGrid"></main>

<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState" style="display: none;">
  <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
  <p>Fotos em breve — fique no aguardo.</p>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-btn lb-close" id="lbClose">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lightbox-btn lb-prev" id="lbPrev">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </button>
  <button class="lightbox-btn lb-next" id="lbNext">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
  </button>
  <img id="lbImg" src="" alt="Subzone">
  <div class="lb-counter" id="lbCounter"></div>
  <a class="lb-download" id="lbDownload" download>
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Baixar
  </a>
</div>

<!-- FOOTER -->
<footer class="gal-footer">
  <a href="index.html#gallery">← Voltar para o site</a>
</footer>

<script>
(() => {
  document.getElementById('edicaoNum').textContent = EDICAO.numero;
  document.getElementById('edicaoNome').textContent = EDICAO.nome;
  document.getElementById('metaLocal').textContent = EDICAO.local;
  document.getElementById('metaData').textContent = EDICAO.data;

  const grid = document.getElementById('photoGrid');
  const emptyState = document.getElementById('emptyState');
  const countEl = document.getElementById('photoCount');

  if (!FOTOS.length) {
    grid.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }

  countEl.textContent = FOTOS.length;

  const dlIcon = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  FOTOS.forEach((src, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item loading';
    item.setAttribute('data-index', i);

    const img = document.createElement('img');
    img.src = src;
    img.alt = `Subzone ${EDICAO.numero} — Foto ${i + 1}`;
    img.loading = 'lazy';
    img.onload = () => item.classList.remove('loading');

    const num = document.createElement('span');
    num.className = 'photo-num';
    num.textContent = String(i + 1).padStart(2, '0') + '/' + String(FOTOS.length).padStart(2, '0');

    const dl = document.createElement('a');
    dl.className = 'download-btn';
    dl.href = src;
    dl.download = '';
    dl.title = 'Baixar foto';
    dl.innerHTML = dlIcon;
    dl.addEventListener('click', (e) => e.stopPropagation());

    item.appendChild(img);
    item.appendChild(num);
    item.appendChild(dl);
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');
  const lbDownload = document.getElementById('lbDownload');
  let currentIdx = 0;

  function openLightbox(idx) {
    currentIdx = idx;
    lbImg.src = FOTOS[idx];
    lbCounter.textContent = (idx + 1) + ' / ' + FOTOS.length;
    lbDownload.href = FOTOS[idx];
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    currentIdx = (currentIdx + dir + FOTOS.length) % FOTOS.length;
    lbImg.src = FOTOS[currentIdx];
    lbCounter.textContent = (currentIdx + 1) + ' / ' + FOTOS.length;
    lbDownload.href = FOTOS[currentIdx];
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); navigate(-1); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); navigate(1); });
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  let touchStartX = 0;
  lightbox.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  lightbox.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 50) navigate(diff > 0 ? -1 : 1);
  }, { passive: true });
})();
</script>
</body>
</html>
